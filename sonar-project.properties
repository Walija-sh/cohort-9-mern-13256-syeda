# Project
sonar.projectKey=NotesHub
sonar.projectName=NotesHub
sonar.projectVersion=1.0

# SonarQube Server
sonar.host.url=http://localhost:9000

# Sources
sonar.sources=backend/src,frontend/src

# Tests
sonar.tests=backend/tests,frontend/tests

# TypeScript
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.app.json

# Test Coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.scannerwork/**